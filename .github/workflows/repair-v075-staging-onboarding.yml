name: Repair v0.7.75 staging onboarding columns

on:
  workflow_dispatch:
  push:
    branches:
      - deploy/v0.7.75-render-staging
    paths:
      - .github/workflows/repair-v075-staging-onboarding.yml

permissions:
  contents: read

concurrency:
  group: fleetbase-v075-schema-repair
  cancel-in-progress: false

jobs:
  repair-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      AIVEN_MYSQL_HOST: ${{ secrets.AIVEN_MYSQL_HOST }}
      AIVEN_HOST: ${{ secrets.AIVEN_HOST }}
      DB_HOST: ${{ secrets.DB_HOST }}
      AIVEN_MYSQL_PORT: ${{ secrets.AIVEN_MYSQL_PORT }}
      AIVEN_PORT: ${{ secrets.AIVEN_PORT }}
      DB_PORT: ${{ secrets.DB_PORT }}
      AIVEN_MYSQL_USER: ${{ secrets.AIVEN_MYSQL_USER }}
      AIVEN_USER: ${{ secrets.AIVEN_USER }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      AIVEN_MYSQL_PASSWORD: ${{ secrets.AIVEN_MYSQL_PASSWORD }}
      AIVEN_PASSWORD: ${{ secrets.AIVEN_PASSWORD }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      AIVEN_MYSQL_CA_PEM: ${{ secrets.AIVEN_MYSQL_CA_PEM }}
      AIVEN_CA_PEM: ${{ secrets.AIVEN_CA_PEM }}
      AIVEN_CA_CERT: ${{ secrets.AIVEN_CA_CERT }}
      AIVEN_MYSQL_DATABASE: ${{ secrets.AIVEN_MYSQL_DATABASE }}
      AIVEN_DATABASE: ${{ secrets.AIVEN_DATABASE }}
      DB_DATABASE: ${{ secrets.DB_DATABASE }}
    steps:
      - uses: actions/checkout@v4
      - name: Install MySQL client driver
        run: python -m pip install --disable-pip-version-check pymysql==1.1.1
      - name: Inspect and repair staging onboarding fields
        run: python ops/repair_staging_onboarding.py
